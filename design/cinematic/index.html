<script>(function(){function R(p){var r=window.__resources;if(!r||!p)return null;var k=p.replace(/^\.\//,'');return r[k]||null}
function fix(el){if(!el||el.nodeType!==1)return;
 if(el.tagName==='IMG'||el.tagName==='VIDEO'||el.tagName==='SOURCE'){var s=el.getAttribute('src');if(s&&s.indexOf('assets/')===0){var u=R(s);if(u)el.setAttribute('src',u)}}
 var st=el.getAttribute&&el.getAttribute('style');if(st&&st.indexOf('assets/')>-1){el.setAttribute('style',st.replace(/assets\/[A-Za-z0-9._@%() -]+?\.(png|jpg|jpeg|avif|webp|gif|svg|mp4)/g,function(m){return R(m)||m}))}}
function sweep(root){fix(root);if(root.querySelectorAll)root.querySelectorAll('img,video,source,[style]').forEach(fix)}
function boot(){if(!window.__resources)return;sweep(document.documentElement);
 new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(sweep);if(m.type==='attributes')fix(m.target)})}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src','style']})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();})();</script>
