<svg xmlns="http://www.w3.org/2000/svg" width="168" height="72" viewBox="0 0 168 72">
  <style>
    g { animation: travel 1.5s linear infinite; }
    @keyframes travel { to { transform: translateX(-84px); } }
    @media (prefers-reduced-motion: reduce) { g { animation: none; } }
  </style>
  <defs>
    <pattern id="waves" width="84" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9Q21 -3 42 9T84 9" fill="none" stroke="#ffe1a4" stroke-width="4"/>
      <path d="M0 9Q21 -3 42 9T84 9" fill="none" stroke="#fffaf2" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="168" height="72" fill="#352944"/>
  <g><rect width="252" height="72" fill="url(#waves)"/></g>
</svg>
